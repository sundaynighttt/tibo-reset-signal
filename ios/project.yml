name: TiboResetSignal
options:
  bundleIdPrefix: com.sundaynighttt
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "8"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 7FCZ5TAX3B
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: YES
    TARGETED_DEVICE_FAMILY: "1"
targets:
  TiboResetSignal:
    type: application
    platform: iOS
    sources:
      - path: TiboResetSignalApp
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sundaynighttt.tiboresetsignal.ios
        PRODUCT_NAME: TiboResetSignal
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Config/App-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/App.entitlements
    dependencies:
      - target: TiboResetSignalWidgetExtension

  TiboResetSignalWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: TiboResetSignalWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sundaynighttt.tiboresetsignal.ios.widget
        PRODUCT_NAME: TiboResetSignalWidget
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Config/Widget-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Widget.entitlements

  TiboResetSignalTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TiboResetSignalTests
    dependencies:
      - target: TiboResetSignal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sundaynighttt.tiboresetsignal.ios.tests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TiboResetSignal.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/TiboResetSignal"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  TiboResetSignal:
    build:
      targets:
        TiboResetSignal: all
        TiboResetSignalWidgetExtension: all
        TiboResetSignalTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TiboResetSignalTests
